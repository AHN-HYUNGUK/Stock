# .github/workflows/dart_sec_monitor.yml

name: DART & SEC Monitor

on:
  schedule:
    - cron: '*/30 0-9 * * 1-5'  # 평일 09시~18시(KST) 30분마다
  workflow_dispatch:              # 수동 실행도 가능

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests feedparser

      - name: 모니터 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python dart_sec_monitor.py

      - name: 전송 기록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sent_ids.json
          git diff --staged --quiet || git commit -m "update sent ids"
          git push
